[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airpad-airmouse"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "scikit-learn>=1.3"
]

[project.optional-dependencies]
vision = ["mediapipe", "opencv-python"]
camera = ["opencv-python", "mediapipe"]
benchmark = []
platform-real = ["pyautogui"]
hotkey-real = ["keyboard"]
all = ["mediapipe", "opencv-python", "scikit-learn", "pyautogui", "keyboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
